{% extends "base.html" %}
{% block title %}Register | Media2Text{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">M2T</div>
        <h1>Create Account</h1>
        <p class="muted">Create your Media2Text account</p>

        <form method="POST" class="form">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter email" required>
            <small class="muted">A 6-digit verification OTP will be sent to this email.</small>

            <label>Password</label>
            <input type="password" name="password" placeholder="Minimum 6 characters" required>

            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Re-enter password" required>

            <button class="btn btn-primary full" type="submit">
                <i class="fa-solid fa-envelope-circle-check"></i>&nbsp; Send Verification OTP
            </button>
        </form>

        <p class="auth-bottom">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>
</div>
{% endblock %}
