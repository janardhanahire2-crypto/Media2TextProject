{% extends "base.html" %}
{% block title %}Login | Media2Text{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><i class="fa-solid fa-user-shield"></i></div>
        <h1>Welcome Back</h1>
        <p class="muted">Login to continue your work</p>

        <form method="POST" class="form">
            <label for="identity">Username or Email</label>
            <div class="input-box">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="identity" name="identity" placeholder="Username or email" autocomplete="username" required>
            </div>

            <label for="loginPassword">Password</label>
            <div class="password-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="loginPassword" name="password" placeholder="Password" autocomplete="current-password" required>
                <button type="button" class="show-password" id="showPassword" aria-label="Show password">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <label class="show-password-check">
                <input type="checkbox" id="showPasswordCheck">
                <span>Show Password</span>
            </label>

            <button class="btn btn-primary full" type="submit">
                <i class="fa-solid fa-right-to-bracket"></i>&nbsp; Login
            </button>
        </form>

        <p class="auth-bottom"><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p>
        <p class="auth-bottom">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
    </div>
</div>
{% endblock %}
