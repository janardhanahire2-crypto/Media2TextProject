{% extends "base.html" %}
{% block title %}Create New Password | Media2Text{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><i class="fa-solid fa-lock"></i></div>
        <h1>Create New Password</h1>
        <p class="muted">Email verified for <strong>{{ email }}</strong>. Enter your new password below.</p>

        <form method="POST" class="form">
            <label for="password">New Password</label>
            <div class="password-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Minimum 6 characters" autocomplete="new-password" minlength="6" required>
            </div>

            <label for="confirm_password">Confirm New Password</label>
            <div class="password-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" autocomplete="new-password" minlength="6" required>
            </div>

            <button class="btn btn-primary full" type="submit">
                <i class="fa-solid fa-key"></i>&nbsp; Update Password
            </button>
        </form>

        <p class="auth-bottom"><a href="{{ url_for('login') }}">Back to Login</a></p>
    </div>
</div>
{% endblock %}
