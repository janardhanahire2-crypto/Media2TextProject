{% extends "base.html" %}
{% block title %}Forgot Password | Media2Text{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo"><i class="fa-solid fa-key"></i></div>
        <h1>Forgot Password?</h1>
        <p class="muted">Enter your registered email address. We will send you a 6-digit OTP.</p>

        <form method="POST" class="form">
            <label for="email">Registered Email</label>
            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Enter registered email" autocomplete="email" required>
            </div>
            <button class="btn btn-primary full" type="submit">
                <i class="fa-solid fa-paper-plane"></i>&nbsp; Send OTP
            </button>
        </form>

        <p class="auth-bottom"><a href="{{ url_for('login') }}">Back to Login</a></p>
    </div>
</div>
{% endblock %}
